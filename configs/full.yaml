# Full comparison config: all four candidates, calibration method chosen per model
# by inner-fold Brier. Requires the modern extra:
#   python -m pip install -e ".[modern]"
# Missing optional packages are skipped with a warning, never a crash.
seed: 42
paths:
  raw: data/raw
  processed: data/processed
  reports: reports
  figures: reports/figures
  models: models
data:
  source_url: https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data
  fallback_url: https://archive.ics.uci.edu/static/public/144/statlog+german+credit+data.zip
  description_url: https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.doc
  filename: german.data
  description_filename: german_credit.names
  expected_rows: 1000
  expected_bad_count: 300
  user_agent: credit-risk/1.0 (research; contact hoanghieu1642002@gmail.com)
  timeout_seconds: 30
  retries: 3
  backoff_seconds: 2.0
  min_interval_seconds: 1.0
split:
  test_size: 0.2
  n_splits: 5
cost:
  cost_bad_approved: 5
  cost_good_rejected: 1
  threshold_min: 0.01
  threshold_max: 0.99
  tolerance: 0.01
calibration:
  method: auto
  inner_splits: 3
conformal:
  alpha: 0.1
train:
  deployed_model: logistic
  label: default
  candidates:
  - logistic
  - lightgbm
  - xgboost
  - catboost
  search:
    trials: 30
    timeout_seconds: 0
    seed: 42
    storage: reports/optuna.db
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 1
    deterministic: true
    force_row_wise: true
    verbosity: -1
  logistic:
    C: 1.0
    max_iter: 2000
    solver: lbfgs
  xgboost:
    n_estimators: 400
    learning_rate: 0.03
    max_depth: 4
    min_child_weight: 1.0
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 1
    tree_method: hist
    enable_categorical: true
    max_cat_to_onehot: 1
  catboost:
    iterations: 500
    learning_rate: 0.03
    depth: 4
    l2_leaf_reg: 3.0
    random_strength: 1.0
    thread_count: 1
    verbose: 0
    allow_writing_files: false
  permutation_repeats: 10
drift:
  bins: 10
  warn: 0.1
  alert: 0.25
serving:
  host: 0.0.0.0
  port: 8000
