# Single source of truth for run settings. Every CLI command accepts --config to
# point at another file with the same shape.
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  reports: reports
  figures: reports/figures
  models: models

data:
  source_url: https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data
  fallback_url: https://archive.ics.uci.edu/static/public/144/statlog+german+credit+data.zip
  description_url: https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.doc
  filename: german.data
  description_filename: german_credit.names
  expected_rows: 1000
  expected_bad_count: 300
  user_agent: "credit-risk/1.0 (research; contact hoanghieu1642002@gmail.com)"
  timeout_seconds: 30
  retries: 3
  backoff_seconds: 2.0
  min_interval_seconds: 1.0

split:
  test_size: 0.2
  n_splits: 5

# German credit cost matrix: approving a bad applicant loses 5 units,
# rejecting a good one costs 1 unit of business.
cost:
  cost_bad_approved: 5
  cost_good_rejected: 1
  threshold_min: 0.01
  threshold_max: 0.99
  tolerance: 0.01

calibration:
  method: isotonic
  inner_splits: 3

train:
  deployed_model: logistic
  label: default
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 1
    deterministic: true
    force_row_wise: true
    verbosity: -1
  logistic:
    C: 1.0
    max_iter: 2000
    solver: lbfgs
  permutation_repeats: 10

drift:
  bins: 10
  warn: 0.1
  alert: 0.25

serving:
  host: 0.0.0.0
  port: 8000
