[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit default model on the Statlog German Credit data, with cost-sensitive thresholding and reason codes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hoang Hieu Nguyen" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
    "pydantic>=2.5",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end to end training tests"]

[tool.coverage.run]
source = ["credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]
