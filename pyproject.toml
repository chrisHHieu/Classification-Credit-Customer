[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit default model on the Statlog German Credit data, with cost-sensitive thresholding and reason codes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hoang Hieu Nguyen" }]
dependencies = [
    "numpy",
    # Evidently 0.7 imports a pandas 2 internal that pandas 3 removed.
    "pandas>=2.1,<3",
    "scikit-learn",
    "lightgbm",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
    "pydantic>=2.5",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Everything `train --config configs/full.yaml`, `tune`, `--track` and
# `drift --evidently` need. Missing pieces are skipped with a warning, never a crash.
modern = [
    "mlflow>=3.0",
    "optuna>=4.0",
    "pandera>=0.20",
    "evidently>=0.7",
    "shap>=0.46",
    "xgboost>=2.0",
    "catboost>=1.2",
    "dvc>=3.50",
]
# Out of scope for the shipped model, kept as an explicit opt-in research path.
deep = ["tabpfn>=2.0", "torch>=2.2"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end to end training tests",
    "modern: needs an optional dependency from the modern extra",
]

[tool.coverage.run]
source = ["credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["credit_risk"]
