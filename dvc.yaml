# Reproducible pipeline. Raw data is tracked with a DVC pointer
# (data/raw/german.data.dvc); the downloaded payload is cached, never committed.
# The data stages below are locked in dvc.lock. Training and evaluation are
# locked by their MLflow run instead, because each one depends on a search that
# takes tens of minutes and is recorded with its config hash.
stages:
  fetch:
    cmd: python -m credit_risk fetch --config configs/full.yaml
    deps:
      - src/credit_risk/data/fetch.py
      - configs/full.yaml
    outs:
      - data/raw/manifest.json

  validate:
    cmd: python -m credit_risk validate --config configs/full.yaml
    deps:
      - data/raw/german.data
      - src/credit_risk/data/validate.py
      - src/credit_risk/data/contracts.py
      - configs/full.yaml

  features:
    cmd: python -m credit_risk features --config configs/full.yaml
    deps:
      - data/raw/german.data
      - src/credit_risk/features/build.py
      - configs/full.yaml
    outs:
      - data/processed/credit_features.csv
