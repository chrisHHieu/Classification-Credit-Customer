name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (base install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: lint
        run: python -m ruff check .

      - name: tests
        run: python -m pytest -q

  modern:
    name: modern (all optional libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,modern]"

      - name: tests
        run: python -m pytest -q

  deep:
    name: deep (TabPFN, manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deep]"

      - name: tests
        run: python -m pytest -q
